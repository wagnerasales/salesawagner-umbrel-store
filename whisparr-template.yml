services:
  whisparrv2:
    container_name: whisparrv2
    image: ghcr.io/hotio/whisparr
    ports:
      - "6969:6969"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Sao_Paulo
    volumes:
      - /home/umbrel/umbrel/app-data/whisparrv2:/config
      - /home/umbrel/umbrel/app-data/whisparrv2:/data
      - /home/umbrel/umbrel/external/MediaNVMe/downloads:/downloads
      - /home/umbrel/umbrel/external/MediaNVMe/media/xxx:/xxx
    restart: always
    networks:
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true